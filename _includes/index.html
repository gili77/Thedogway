---
# שורות אלו אומרות ל-GitHub להפעיל את ה-Include בצד השרת
---
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dogway</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f8f9fa;
            --text: #333;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 4rem 2rem;
            border-bottom: 5px solid var(--accent);
        }
        header h1 { margin: 0; font-size: 3rem; }
        header p { margin: 1rem 0 0; font-size: 1.2rem; opacity: 0.9; }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        /* עיצוב שיחול אוטומטית על כל הטאגים שיופיעו בתוך קובץ התוכן */
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }
        h2 {
            color: var(--primary);
            border-bottom: 3px solid var(--accent);
            padding-bottom: 0.5rem;
            display: inline-block;
            margin-top: 0;
        }
        p {
            font-size: 1.1rem;
            color: #444;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #777;
            font-size: 0.9rem;
            margin-top: 4rem;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Dogway</h1>
        <p>הבית של הלהקה והיצירה</p>
    </header>

    <main>
        <div class="card">
            <!-- כאן GitHub מחבר את הקוד בצד השרת לקובץ אחד חלק לחלוטין -->
            {% include content.html %}
        </div>
    </main>

    <footer>
        <p>© 2026 thedogway.org - כל הזכויות שמורות</p>
    </footer>

</body>
</html>
